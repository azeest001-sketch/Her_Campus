name: her_campus
description: Campus safety app — team project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  team_map:
    path: map
  geolocator: ^14.0.3
  supabase_flutter: ^2.9.0
  flutter_dotenv: ^6.0.1
  permission_handler: 11.3.1
  flutter_blue_plus: ^2.3.12
  wifi_scan: ^0.4.1+2
  crypto: ^3.0.7
  uuid: ^4.6.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Bundles local `.env` so SupabaseService can read SUPABASE_URL / keys at runtime.
  # `.env` itself stays gitignored; commit only `.env.example`.
  assets:
    - .env
